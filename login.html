<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | MyRestaurant</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- LOGIN SECTION -->
<section class="d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4">

            <!-- Logo / Title -->
            <div class="text-center mb-4">
              <i class="bi bi-cup-hot-fill fs-1 text-warning"></i>
              <h3 class="fw-bold mt-2"> Maruthi<span class="text-warning">Restaurant</span></h3>
              <p class="text-muted">Login to continue</p>
            </div>

            <!-- Form -->
            <form>
              <!-- Email -->
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" class="form-control" placeholder="Enter email" required>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" class="form-control" placeholder="Enter password" required>
                </div>
              </div>

              <!-- Remember + Forgot -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">
                    Remember me
                  </label>
                </div>
                <a href="#" class="text-decoration-none">Forgot password?</a>
              </div>

              <!-- Button -->
              <button class="btn btn-warning w-100 fw-bold">Login</button>
            </form>

            <!-- Divider -->
            <div class="text-center my-3 text-muted">OR</div>

            <!-- Social Login -->
            <div class="d-grid gap-2">
              <button class="btn btn-outline-dark">
                <i class="bi bi-google me-2"></i> Login with Google
              </button>
              <button class="btn btn-outline-primary">
                <i class="bi bi-facebook me-2"></i> Login with Facebook
              </button>
            </div>

            <!-- Signup -->
            <p class="text-center mt-3 mb-0">
              Don’t have an account?
              <a href="restaurant.html" class="fw-bold text-decoration-none">Sign up</a>
            </p>

          </div>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
